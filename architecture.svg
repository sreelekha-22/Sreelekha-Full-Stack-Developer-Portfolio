<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ea0c0"/>
    </marker>
  </defs>
  <rect width="1080" height="620" fill="#0b1020"/>
  <text x="32" y="44" fill="#e6ecf7" font-size="22" font-weight="600">Vykronis — architecture (demo scope)</text>
  <text x="32" y="70" fill="#8ea0c0" font-size="13">Dashed = started with optional profiles (observability / search / ai). * = fallback / optional.</text>

  <!-- UI / gateway -->
  <g font-size="13">
    <rect x="40"  y="120" width="150" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="115" y="146" fill="#e6ecf7" text-anchor="middle" font-weight="600">Dashboard UI</text>
    <text x="115" y="163" fill="#8ea0c0" text-anchor="middle">static + incidents</text>
    <rect x="40"  y="220" width="150" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="115" y="246" fill="#e6ecf7" text-anchor="middle" font-weight="600">API Gateway</text>
    <text x="115" y="263" fill="#8ea0c0" text-anchor="middle">/incidents /search</text>

    <!-- pipeline column 1: ingestion + correlation -->
    <rect x="260" y="120" width="150" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="335" y="146" fill="#e6ecf7" text-anchor="middle" font-weight="600">Ingestion</text>
    <text x="335" y="163" fill="#8ea0c0" text-anchor="middle">POST /ingest/events</text>
    <rect x="260" y="250" width="150" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="335" y="276" fill="#e6ecf7" text-anchor="middle" font-weight="600">Correlation</text>
    <text x="335" y="293" fill="#8ea0c0" text-anchor="middle">60s windows / detect</text>

    <!-- kafka bus -->
    <rect x="455" y="90"  width="200" height="300" rx="12" fill="#131a2e" stroke="#1f2a44" stroke-dasharray="5 4"/>
    <text x="555" y="112" fill="#4fa0ff" text-anchor="middle" font-size="14" font-weight="600">Kafka bus</text>
    <text x="555" y="170" fill="#e6ecf7" text-anchor="middle">obs.metrics</text>
    <text x="555" y="205" fill="#8ea0c0" text-anchor="middle">obs.events</text>
    <text x="555" y="262" fill="#e6ecf7" text-anchor="middle">obs.remediation</text>
    <text x="555" y="297" fill="#8ea0c0" text-anchor="middle">remediation_results</text>
    <text x="555" y="352" fill="#8ea0c0" text-anchor="middle">remediation_learn</text>

    <!-- services column 2 -->
    <rect x="710" y="120" width="160" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="790" y="146" fill="#e6ecf7" text-anchor="middle" font-weight="600">Incident Service</text>
    <text x="790" y="163" fill="#8ea0c0" text-anchor="middle">state machine</text>
    <rect x="710" y="220" width="160" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="790" y="246" fill="#e6ecf7" text-anchor="middle" font-weight="600">Orchestrator</text>
    <text x="790" y="263" fill="#8ea0c0" text-anchor="middle">tool agent / fallback</text>
    <rect x="710" y="320" width="160" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="790" y="346" fill="#e6ecf7" text-anchor="middle" font-weight="600">Policy Engine</text>
    <text x="790" y="363" fill="#8ea0c0" text-anchor="middle">decision matrix</text>
    <rect x="710" y="420" width="160" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="790" y="446" fill="#e6ecf7" text-anchor="middle" font-weight="600">Remediation</text>
    <text x="790" y="463" fill="#8ea0c0" text-anchor="middle">executor (compose)</text>

    <!-- evidence column -->
    <rect x="910" y="120" width="140" height="60" rx="10" fill="#131a2e" stroke="#4fa0ff"/>
    <text x="980" y="146" fill="#e6ecf7" text-anchor="middle" font-weight="600">Event Service</text>
    <text x="980" y="163" fill="#8ea0c0" text-anchor="middle">search + evidence</text>
    <rect x="910" y="220" width="140" height="42" rx="10" fill="#131a2e" stroke="#1f2a44" stroke-dasharray="5 4"/>
    <text x="980" y="240" fill="#8ea0c0" text-anchor="middle" font-size="11">Postgres fallback</text>
    <text x="980" y="253" fill="#8ea0c0" text-anchor="middle" font-size="11">OpenSearch* / Ollama*</text>

    <!-- infra strip -->
    <rect x="40" y="520" width="1000" height="44" rx="10" fill="#131a2e" stroke="#1f2a44"/>
    <text x="52" y="540" fill="#8ea0c0" font-size="12">Infra:</text>
    <text x="140" y="540" fill="#e6ecf7" font-size="12">Kafka</text>
    <text x="230" y="540" fill="#e6ecf7" font-size="12">PostgreSQL</text>
    <text x="340" y="540" fill="#e6ecf7" font-size="12">Redis</text>
    <text x="430" y="540" fill="#8ea0c0" font-size="12">otel-collector*</text>
    <text x="550" y="540" fill="#8ea0c0" font-size="12">Prometheus/Grafana*</text>
    <text x="700" y="540" fill="#8ea0c0" font-size="12">OpenSearch*</text>
    <text x="820" y="540" fill="#8ea0c0" font-size="12">Ollama*</text>
    <text x="940" y="540" fill="#8ea0c0" font-size="12">Keycloak*</text>
  </g>

  <!-- arrows -->
  <g stroke="#8ea0c0" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M190,150 H255"/>
    <path d="M190,250 H455 V370 H265"/>
    <path d="M410,280 H455"/>
    <path d="M655,150 H710"/>
    <path d="M655,250 H710"/>
    <path d="M655,350 H710"/>
    <path d="M655,450 H710"/>
    <path d="M870,150 H910"/>
    <path d="M790,180 V215"/>
    <path d="M810,280 H910"/>
    <path d="M965,185 V262"/>
    <path d="M790,280 V323"/>
  </g>

  <!-- labels -->
  <g fill="#8ea0c0" font-size="11">
    <text x="222" y="140">events</text>
    <text x="222" y="355">detected incident</text>
    <text x="640" y="142">create/query →</text>
    <text x="640" y="242">investigate →</text>
    <text x="640" y="342">decide →</text>
    <text x="640" y="442">command →</text>
    <text x="900" y="142">evidence</text>
    <text x="812" y="200">state machine</text>
    <text x="862" y="296">hypothesis + tools</text>
    <text x="786" y="306">approval request</text>
  </g>
</svg>